<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F5F4F0">
<title>课题组工作台</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css">
<script src="js/theme.js"></script>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">研</div>
      <div class="brand-text">
        <div class="brand-title">课题组工作台</div>
        <div class="brand-sub" id="brand-sub">正在加载…</div>
      </div>
    </div>

    <button class="search-trigger" type="button" data-action="open-palette" aria-label="搜索与跳转">
      <span class="st-icon" id="search-trigger-icon"></span>
      <span class="st-text">搜索与跳转</span>
      <kbd id="search-kbd">Ctrl K</kbd>
    </button>

    <nav class="nav" id="nav" aria-label="主导航"></nav>

    <div class="member-switch" id="member-switch"></div>
  </aside>
  <div class="sidebar-backdrop" data-action="close-sidebar"></div>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn menu-btn" type="button" id="menu-btn" data-action="open-sidebar" aria-label="打开导航"></button>
        <div class="topbar-title">
          <div class="crumb" id="crumb">工作区 / 总览</div>
          <h1 id="page-title">总览</h1>
        </div>
      </div>
      <div class="topbar-right">
        <span class="today" id="today"></span>
        <button class="icon-btn search-btn" type="button" id="search-btn" data-action="open-palette" aria-label="搜索"></button>
        <button class="icon-btn" type="button" id="theme-toggle" data-action="toggle-theme" aria-label="切换深色 / 浅色模式"></button>
        <button class="btn btn-primary" type="button" id="quick-report">今日上报</button>
      </div>
    </header>
    <div class="view" id="view">
      <div class="boot-loading"><span class="spinner"></span>正在加载工作台…</div>
    </div>
  </main>
</div>

<div id="auth-root" aria-live="polite"></div>
<div id="modal-root"></div>
<div id="palette-root"></div>
<div id="confirm-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/ai.js"></script>
<script src="js/charts.js"></script>
<script src="js/auth-ui.js"></script>
<script src="js/notifications.js"></script>
<script src="js/app.js"></script>
</body>
</html>
