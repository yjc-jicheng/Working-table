<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课题组工作台</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">研</div>
      <div class="brand-text">
        <div class="brand-title">课题组工作台</div>
        <div class="brand-sub" id="brand-sub">智能感知与分子设计实验室</div>
      </div>
    </div>

    <div class="member-switch" id="member-switch"></div>

    <nav class="nav" id="nav"></nav>

  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <div class="crumb" id="crumb">工作区 / 总览</div>
        <h1 id="page-title">总览</h1>
      </div>
      <div class="topbar-right">
        <span class="today" id="today"></span>
        <button class="btn btn-primary" id="quick-report">+ 今日上报</button>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<div id="auth-root" aria-live="polite"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script src="js/seed.js"></script>
<script src="js/store.js"></script>
<script src="js/ai.js"></script>
<script src="js/auth-ui.js"></script>
<script src="js/notifications.js"></script>
<script src="js/app.js"></script>
</body>
</html>
